services:
  - type: web
    name: taxsaathi-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_ADVISORY
        value: llama-3.1-8b-instant
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
